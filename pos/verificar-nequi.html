<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador Nequi QR | Moteros Sports Line</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nequi-purple: #7124cc;
            --nequi-pink: #f43f9a;
            --premium-black: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            z-index: 10;
        }

        .header {
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #94a3b8;
            font-weight: 300;
        }

        /* ESCÁNER UI */
        #reader {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        #reader__scan_region {
            background: transparent !important;
        }

        /* DISEÑO DE LA "MIRA" DEL ESCÁNER */
        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            pointer-events: none;
            z-index: 5;
        }

        .scanner-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--nequi-pink);
            box-shadow: 0 0 15px var(--nequi-pink);
            animation: scanning 2s ease-in-out infinite;
        }

        @keyframes scanning {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* CONTROLES */
        .controls {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            padding: 1.25rem;
            border-radius: 16px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--nequi-purple), #4f1d91);
            box-shadow: 0 8px 25px rgba(113, 36, 204, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-group {
            margin-top: 1.5rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .manual-input {
            width: 100%;
            padding: 1.25rem;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .manual-input:focus {
            border-color: var(--nequi-pink);
        }

        /* RESULTADOS */
        #result-card {
            margin-top: 2rem;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass);
            border-radius: 24px;
            padding: 2rem;
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .status-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .result-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
        .result-ref { font-family: monospace; color: #94a3b8; margin-bottom: 1.5rem; }
        .result-amount { font-size: 1.8rem; font-weight: 800; color: white; margin-bottom: 1.5rem; }

        .footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .decor-circle {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: var(--nequi-purple);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
        }

        .circle-1 { top: -100px; right: -100px; }
        .circle-2 { bottom: -100px; left: -100px; background: var(--nequi-pink); }
    </style>
</head>
<body>
    <div class="decor-circle circle-1"></div>
    <div class="decor-circle circle-2"></div>

    <div class="container">
        <div class="header">
            <h1>Verificador Nequi</h1>
            <p>Escanea el código QR del cliente para validar el pago en tiempo real.</p>
        </div>

        <div id="reader-container">
            <div id="reader-box">
                <div id="reader"></div>
            </div>
            <div id="scanner-line" class="scanner-overlay" style="display:none;"></div>
        </div>

        <div id="result-card">
            <div id="status-badge" class="status-badge">Verificando...</div>
            <div class="result-title" id="res-nombre">Procesando código</div>
            <div class="result-ref" id="res-ref">ID: N/A</div>
            <div class="result-amount" id="res-monto">$ 0</div>
            <button class="btn btn-primary" onclick="window.location.reload()" style="width:100%">Nuevo Escaneo</button>
        </div>

        <div class="controls" id="initial-controls">
            <button class="btn btn-primary" onclick="iniciarEscaneo()">
                📷 Iniciar Cámara
            </button>
            <button class="btn btn-secondary" onclick="mostrarEntradaManual()">
                ⌨️ Digitar Referencia
            </button>
            <button class="btn btn-secondary" onclick="window.close()" style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.7;">
                Salir
            </button>
        </div>

        <div class="input-group" id="manual-group">
            <input type="text" id="manualRef" class="manual-input" placeholder="Ingrese el código de referencia">
            <button class="btn btn-primary" onclick="verificarManual()">
                Verificar Ahora
            </button>
            <button class="btn btn-secondary" onclick="cancelarManual()" style="margin-top:0.5rem">
                Cancelar
            </button>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 Moteros Sports Line - Tecnología VisionGuard IA
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/nequi-verifier.js"></script>
    <script>
        let html5QrCode;

        async function iniciarEscaneo() {
            document.getElementById('initial-controls').style.display = 'none';
            document.getElementById('manual-group').style.display = 'none';
            document.getElementById('scanner-line').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess
                );
            } catch (err) {
                alert("Error al acceder a la cámara: " + err);
                document.getElementById('initial-controls').style.display = 'flex';
                document.getElementById('scanner-line').style.display = 'none';
            }
        }

        function mostrarEntradaManual() {
            document.getElementById('initial-controls').style.display = 'none';
            document.getElementById('manual-group').style.display = 'flex';
            document.getElementById('manualRef').focus();
        }

        function cancelarManual() {
            document.getElementById('manual-group').style.display = 'none';
            document.getElementById('initial-controls').style.display = 'flex';
        }

        async function verificarManual() {
            const ref = document.getElementById('manualRef').value.trim();
            if (!ref) {
                alert("Por favor ingrese una referencia");
                return;
            }
            document.getElementById('manual-group').style.display = 'none';
            mostrarResultado(ref);
        }

        function onScanSuccess(decodedText, decodedResult) {
            console.log(`Code matched = ${decodedText}`, decodedResult);
            
            // Detener escáner
            html5QrCode.stop().then(() => {
                document.getElementById('reader-box').style.display = 'none';
                document.getElementById('scanner-line').style.display = 'none';
                mostrarResultado(decodedText);
            });
        }

        async function mostrarResultado(data) {
            const card = document.getElementById('result-card');
            const badge = document.getElementById('status-badge');
            card.style.display = 'block';

            // Simular verificación o llamar a la API si hay llaves
            badge.className = 'status-badge status-pending';
            badge.textContent = 'Verificando en Nequi...';

            try {
                if (typeof verifCore === 'undefined') {
                    throw new Error("Lógica no cargada");
                }
                
                const response = await verifCore.verificar(data);
                
                if(response.success) {
                    badge.className = 'status-badge status-success';
                    badge.textContent = '✅ Pago Confirmado';
                    document.getElementById('res-nombre').textContent = response.data.cliente || 'Transacción Válida';
                    document.getElementById('res-ref').textContent = 'Ref: ' + response.data.referencia;
                    document.getElementById('res-monto').textContent = '$ ' + response.data.monto;
                } else {
                    badge.className = 'status-badge status-error';
                    badge.textContent = '❌ No Encontrado';
                    document.getElementById('res-nombre').textContent = 'Error de Validación';
                    document.getElementById('res-ref').textContent = data.length > 30 ? data.substring(0, 30) + '...' : data;
                    document.getElementById('res-monto').textContent = 'Pago no detectado';
                }
            } catch (e) {
                console.error(e);
                badge.className = 'status-badge status-error';
                badge.textContent = '⚠️ Error de Conexión';
            }
        }
    </script>
</body>
</html>

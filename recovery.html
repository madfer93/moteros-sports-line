<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Moteros Sports Line</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/index.css">

    <style>
        .texture-bg {
            background-color: #f8fafc;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e2e8f0' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");

</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans texture-bg">
    
    <div class="fixed top-6 left-6">
        <a href="index.html" class="flex items-center gap-2 text-slate-600 hover:text-slate-900 transition-colors">
            <i class="fas fa-arrow-left"></i> Volver a Moteros
        </a>
    </div>

    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] w-full max-w-md border border-slate-100 relative overflow-hidden">
        <!-- Decoración -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-500 to-orange-400"></div>
        
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-white rounded-full mx-auto p-1 shadow-md mb-6 border border-slate-100 flex items-center justify-center">
                <img src="img/logo-moteros.jpeg" alt="Moteros Sports Line" class="w-full h-full rounded-full object-cover">
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Recuperar Acceso</h1>
            <p class="text-slate-500 mt-2 text-sm">Establece tu nueva contraseña segura</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Nueva Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-slate-400"></i>
                    </div>
                    <input type="password" id="newPassword" 
                        class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all bg-slate-50 focus:bg-white"
                        placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Confirmar Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-check-circle text-slate-400"></i>
                    </div>
                    <input type="password" id="confirmPassword" 
                        class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all bg-slate-50 focus:bg-white" 
                        placeholder="Repite tu contraseña">
                </div>
            </div>

            <button onclick="actualizarPassword()" 
                class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-slate-800 hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all mt-4 transform hover:-translate-y-0.5"
                style="background: linear-gradient(to right, #f97316, #ea580c); box-shadow: 0 4px 14px 0 rgba(234, 88, 12, 0.39);">
                <i class="fas fa-save"></i> Guardar Nueva Contraseña
            </button>
            
            <div id="mensaje" class="text-center text-sm font-medium mt-4 p-3 rounded-lg hidden"></div>
        </div>
    </div>

    <script>
        // Credenciales correctas de config.js
        const SUPABASE_URL = 'https://pbblthbrdkevuyjxyuar.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiYmx0aGJyZGtldnV5anh5dWFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNjUwMzcsImV4cCI6MjA4MTc0MTAzN30.bNAcp186l7l9IRWdcwBxuSgvmRtRy-qPFhZ7HRvaBZE';

        // Inicializar Supabase
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('mensaje').textContent = 'Error de conexión';
            document.getElementById('mensaje').style.color = '#ef4444';
        }

        // Funci�n global
        window.actualizarPassword = async function () {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const mensaje = document.getElementById('mensaje');
            
            mensaje.className = "text-center text-sm font-medium mt-4 p-3 rounded-lg block"; // reset y mostrar

            if (!newPassword || newPassword.length < 6) {
                mensaje.textContent = 'La contraseña debe tener al menos 6 caracteres';
                mensaje.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-100');
                return;
            }

            if (newPassword !== confirmPassword) {
                mensaje.textContent = 'Las contraseñas no coinciden';
                mensaje.className = "text-center text-sm font-medium mt-4 p-3 rounded-lg block bg-red-50 text-red-600 border border-red-100";
                return;
            }

            try {
                mensaje.textContent = 'Actualizando contraseña...';
                mensaje.className = "text-center text-sm font-medium mt-4 p-3 rounded-lg block bg-blue-50 text-blue-600 border border-blue-100";

                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                mensaje.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Contraseña actualizada correctamente. Redirigiendo...';
                mensaje.className = "text-center text-sm font-medium mt-4 p-3 rounded-lg block bg-green-50 text-green-600 border border-green-100";

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                mensaje.textContent = 'Error: ' + error.message;
                mensaje.className = "text-center text-sm font-medium mt-4 p-3 rounded-lg block bg-red-50 text-red-600 border border-red-100";
            }
        };

        // Verificar token
        const hash = window.location.hash;
        if (!hash || !hash.includes('access_token')) {
            const msj = document.getElementById('mensaje');
            msj.textContent = 'Link de recuperación inválido o expirado';
            msj.className = "text-center text-sm font-medium mt-4 p-3 rounded-lg block bg-amber-50 text-amber-600 border border-amber-100";
        }
    </script>
    <script src="js/security.js"></script>
    <script src="js/config.js"></script>
    <script src="js/index.js"></script>
</body>

</html>

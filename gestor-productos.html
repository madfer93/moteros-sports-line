<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Gestión de Productos | Moteros Sport Line</title>
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #e65a00;
            --secondary: #1e293b;
            --bg-body: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            color: #1e293b;
        }

        /* LOGIN SCREEN */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            width: 120px;
            margin-bottom: 1.5rem;
        }

        .login-card h2 {
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .login-card p {
            color: #64748b;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* MAIN PANEL */
        #gestorPanel {
            display: none;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .logout-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        /* REPLICATED STYLES FROM ADMIN */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            position: relative;
            max-width: 500px;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-box input {
            padding-left: 3rem;
        }

        /* PRODUCT GRID & CARDS */
        .productos-admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 1rem 0;
        }

        .producto-admin-card {
            background: white;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
        }

        .producto-admin-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .producto-admin-img {
            width: 100%;
            height: 250px;
            overflow: hidden;
            position: relative;
            background: #f8fafc;
        }

        .producto-admin-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .producto-admin-card:hover .producto-admin-img img {
            transform: scale(1.1);
        }

        .producto-admin-info {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .producto-admin-info h4 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
        }

        .producto-meta {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .producto-precios {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: auto;
            padding: 1rem 0;
            border-top: 1px solid #f1f5f9;
        }

        .precio-item {
            display: flex;
            flex-direction: column;
        }

        .precio-item label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .precio-item strong {
            font-size: 1.1rem;
            color: var(--primary);
        }

        .producto-admin-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .producto-admin-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 0.85rem;
            padding: 0.6rem;
        }

        .badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 5;
        }

        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-danger { background: #fee2e2; color: #b91c1c; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(255, 107, 0, 0.2);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-danger {
            background: #fee2e2;
            color: #ef4444;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        /* MODAL CUSTOMIZATION */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 11000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 1100px;
            max-height: 90vh;
            border-radius: 1.5rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-body {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1.5rem 2rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        /* TOAST */
        #toastContainer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 20000;
        }

        .toast {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>

<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen">
        <div class="login-card">
            <img src="img/android-chrome-192x192.png" alt="Moteros" class="login-logo">
            <h2>Gestor de Productos</h2>
            <p>Ingresa tus credenciales para continuar</p>
            
            <div id="loginError" style="display:none; background:#fee2e2; color:#ef4444; padding:0.8rem; border-radius:0.5rem; margin-bottom:1.5rem; font-size:0.9rem;"></div>

            <div class="form-group">
                <label>Usuario o Cédula</label>
                <input type="text" id="userLogin" class="form-control" placeholder="Ej: diana.gutierrez">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="passLogin" class="form-control" placeholder="••••••••">
            </div>

            <button class="btn-login" onclick="intentarLogin()">Iniciar Sesión</button>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="gestorPanel">
        <header class="panel-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">D</div>
                <div>
                    <h3 style="margin:0;" id="userName">Diana Marcela</h3>
                    <span style="color:#64748b; font-size:0.85rem;">Gestor de Productos</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logoutGestor()">Cerrar Sesión</button>
        </header>

        <section id="productosSection" class="section active">
            <div class="actions-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscarProductoAdmin" class="form-control" placeholder="Buscar por nombre, referencia o marca..." oninput="filtrarProductosAdmin()">
                </div>
                <div style="display:flex; gap:1rem;">
                    <button class="btn btn-primary" onclick="mostrarFormProducto()">
                        <i class="fas fa-plus"></i> Nuevo Producto
                    </button>
                </div>
            </div>

            <div id="listaProductos" class="productos-admin-grid">
                <!-- Se carga vía JS -->
            </div>
        </section>
    </div>

    <!-- MODAL PRODUCTO (Replicado de admin.html) -->
    <div id="formProducto" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="formTituloProducto">➕ Nuevo Producto</h2>
                <button onclick="cancelarFormProducto()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="productoId">
                
                <!-- Estructura del Formulario -->
                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:2rem;">
                    <div>
                        <div class="form-group">
                            <label>Nombre del Producto *</label>
                            <input type="text" id="productoNombre" class="form-control" placeholder="Ej: Casco Shaft 581">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Referencia / SKU</label>
                                <input type="text" id="productoReferencia" class="form-control" placeholder="SKU-123">
                            </div>
                            <div class="form-group">
                                <label>Marca</label>
                                <input type="text" id="productoMarca" class="form-control" placeholder="Ej: Shaft">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Categoría</label>
                                <select id="productoCategoria" class="form-control" onchange="actualizarFormularioPorCategoria()"></select>
                            </div>
                            <div class="form-group">
                                <label>Proveedor</label>
                                <select id="productoProveedor" class="form-control"></select>
                            </div>
                        </div>

                        <!-- Sección de Colores y Fotos -->
                        <div style="margin-top:2rem;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                                <h4 style="margin:0;">🎨 Colores y Fotos</h4>
                                <button type="button" class="btn btn-sm btn-primary" onclick="agregarFilaColor()">+ Agregar Color</button>
                            </div>
                            <div id="containerColoresFotos" style="display:flex; flex-direction:column; gap:0.5rem;"></div>
                        </div>

                        <!-- Sección de Tallas y Stock -->
                        <div id="containerTallasStock" style="margin-top:2rem; display:none;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                                <h4 style="margin:0;">📏 Tallas y Stock</h4>
                                <button type="button" class="btn btn-sm btn-primary" onclick="agregarFilaTalla()">+ Agregar Variantes</button>
                            </div>
                            <div class="table-container">
                                <table class="data-table" id="tablaTallasStock">
                                    <thead>
                                        <tr>
                                            <th>Color</th>
                                            <th>Talla</th>
                                            <th>Alcalá</th>
                                            <th>Local 01</th>
                                            <th>Jordán</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbodyTallasStock"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha: Precios e Imagen Principal -->
                    <div>
                        <div class="form-group">
                            <label>Imagen Principal</label>
                            <div style="border:2px dashed #e2e8f0; border-radius:1rem; padding:1rem; text-align:center;">
                                <img id="previewProducto" src="" style="max-width:100%; display:none; border-radius:0.5rem; margin-bottom:1rem;">
                                <input type="file" id="fileInputProducto" style="display:none;" onchange="manejarImagenPrincipal(this)">
                                <button type="button" class="btn-login" style="background:#f1f5f9; color:#475569;" onclick="document.getElementById('fileInputProducto').click()">Subir Imagen</button>
                                <input type="hidden" id="productoImagen">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Precio de Compra (Costo)</label>
                            <input type="number" id="productoPrecioCompra" class="form-control" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Precio de Venta</label>
                            <input type="number" id="productoPrecio" class="form-control" placeholder="0">
                        </div>
                        
                        <div style="background:#f0fdf4; padding:1rem; border-radius:1rem; margin-top:1rem;">
                            <label style="font-weight:700; color:#166534;">Stock Total Consolidado</label>
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-top:0.5rem;">
                                <div><small>Alcalá:</small> <input type="number" id="stockAlcala" class="form-control" readonly></div>
                                <div><small>Local 01:</small> <input type="number" id="stockLocal01" class="form-control" readonly></div>
                                <div><small>Jordán:</small> <input type="number" id="stockJordan" class="form-control" readonly></div>
                                <div><small>Digital:</small> <input type="number" id="stockDigital" class="form-control"></div>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top:1rem;">
                            <label>Estado</label>
                            <select id="productoEstado" class="form-control">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="logout-btn" style="background:#e2e8f0; color:#475569;" onclick="cancelarFormProducto()">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarProducto()">💾 Guardar Producto</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/gestor-productos.js"></script>

</body>

</html>
